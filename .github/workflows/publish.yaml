name: Publish reports to GitHub Pages

on:
  push:
    branches:
      - master   # или master — зависит от того, как называется твоя основная ветка

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем твой репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Генерируем index.json из HTML-отчётов
      - name: Generate index.json
        run: |
          python3 generate_index.py
          echo "--- index.json preview ---"
          head -n 30 index.json || cat index.json

      # 4. Готовим артефакт для GitHub Pages (папка site)
      - name: Prepare site folder
        run: |
          mkdir -p site
          cp -r index.html index.json reports site/

      # 5. Загружаем на GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
